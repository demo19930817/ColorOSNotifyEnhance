name: Self Release (snapshot-signed)

# 自用发版流程：推 tag 或手动触发 → 编译 release APK → 直接发 Release。
# 签名用仓库内的 .secret/universal.p12（公开开发证书），与设备上已装的包一致，
# 所以可以直接 `adb install -r` 覆盖升级，规则包和配置都不会丢。
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（留空则使用当前 ref）'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 21
          java-package: jdk
          distribution: temurin
          cache: gradle

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          install -m 0644 "$apk" "${RUNNER_TEMP}/C17NotifyReplace.apk"
          sha256sum "${RUNNER_TEMP}/C17NotifyReplace.apk" | tee "${RUNNER_TEMP}/C17NotifyReplace.apk.sha256"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            "${RUNNER_TEMP}/C17NotifyReplace.apk" \
            "${RUNNER_TEMP}/C17NotifyReplace.apk.sha256" \
            --title "$tag" \
            --generate-notes \
            --target "$GITHUB_SHA"
